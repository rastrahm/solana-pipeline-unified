[package]
name = "solana-pipeline-unified"
version = "0.1.0"
edition = "2021"
description = "Orquestador de aprendizaje: une mini-solana-turbine con nvme-state-db"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Por defecto igual que turbine. Sin io_uring en el kernel/CI:
#   cargo test --no-default-features --features simd
default = ["uring", "simd"]
uring = ["mini-solana-turbine/uring"]
simd = ["mini-solana-turbine/simd"]

[lib]
name = "solana_pipeline_unified"
path = "src/lib.rs"

[[bin]]
name = "solana-pipeline-unified"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "2"
mini-solana-turbine = { path = "../mini-solana-turbine", default-features = false }
nvme-state-db = { path = "../nvme-state-db" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[test]]
name = "ingest_to_bridge"
required-features = ["simd"]

[[bench]]
name = "e2e_throughput"
harness = false
required-features = ["simd"]
